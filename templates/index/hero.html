{{ define "hero" }}
  <div class="hero-container">
    <!-- Header section without logos (moved to navbar) -->
    <div class="hero-header d-flex justify-content-between align-items-center w-100 mb-4">
      <div></div>
      
      {{ if .Countdown.Enabled }}
        <div class="countdown-compact d-none d-lg-flex">
          <div class="d-flex flex-column text-end">
            <h6 class="countdown-headline mb-1" style="font-size: 16px; font-weight: 600; color: var(--font-color);">{{ .Countdown.Title }}</h6>
            <div class="d-flex gap-3">
              <div class="countdown-item text-center">
                <span class="countdown-epoch d-block" style="font-size: 18px; font-weight: 700; color: var(--primary);"></span>
                <small style="font-size: 12px; color: var(--gray);">Epochs</small>
              </div>
              <div class="countdown-item text-center">
                <span class="countdown-slot d-block" style="font-size: 18px; font-weight: 700; color: var(--primary);"></span>
                <small style="font-size: 12px; color: var(--gray);">Slots</small>
              </div>
            </div>
            <div class="countdown-time mt-1" style="font-size: 14px; font-weight: 500; color: var(--font-color);"></div>
          </div>
        </div>
      {{ end }}
    </div>

    <!-- Main content section -->
    <div class="hero-content d-flex flex-column align-items-center text-center">
      <!-- EthPar Text Logo - Theme dependent -->
      <div class="ethpar-logo-container mb-4">
        <img id="ethpar-logo-light" src="/img/ETHPAR-Logo-text.svg" alt="EthPar Logo Text" style="height: 80px; width: auto; max-width: 100%;">
        <img id="ethpar-logo-dark" src="/img/ETHPAR-Logo-Text-dark.svg" alt="EthPar Logo Text" style="height: 80px; width: auto; max-width: 100%; display: none;">
      </div>

      <h1 class="hero-title mb-2" style="font-size: 2.5rem; font-weight: 700; color: var(--font-color);">{{ .Title }}</h1>
      <h5 class="hero-subtitle mb-4" style="color: var(--gray); font-weight: 400;">{{ .Subtitle }}</h5>
    </div>

    <!-- Mobile countdown section -->
    {{ if .Countdown.Enabled }}
      <div class="d-flex d-lg-none align-items-center justify-content-center w-100 mt-4">
        <div class="d-flex flex-column text-center">
          <h3 class="countdown-headline mb-2" style="font-size: 20px; font-weight: 600; color: var(--font-color);">{{ .Countdown.Title }}</h3>
          <div class="d-flex justify-content-center gap-4 mb-2">
            <div class="countdown-item text-center">
              <span class="countdown-epoch d-block" style="font-size: 24px; font-weight: 700; color: var(--primary);"></span>
              <small style="font-size: 14px; color: var(--gray);">Epochs</small>
            </div>
            <div class="countdown-item text-center">
              <span class="countdown-slot d-block" style="font-size: 24px; font-weight: 700; color: var(--primary);"></span>
              <small style="font-size: 14px; color: var(--gray);">Slots left</small>
            </div>
          </div>
          <div class="countdown-time" style="font-size: 18px; font-weight: 600; color: var(--font-color);"></div>
        </div>
      </div>
    {{ end }}
  </div>

  <script src="/js/jquery.min.js"></script>
  <script src="/js/luxon.min.js"></script>
  <script src="/js/herofeed.js"></script>
  {{ if .Countdown.Enabled }}
  <script>
    let c_epoch = {{$.CurrentEpoch}}, c_slot = {{$.CurrentSlot}}, t = 12

    function updateCountdown() {
      let time_diff = luxon.DateTime.fromMillis({{.Countdown.Timestamp}}).diff(luxon.DateTime.local())
      if (time_diff.milliseconds <= 0) { 
        $('.countdown-time').html('00:00:00'); 
        return 
      }
      
      time_diff = time_diff.toObject()
      let time_left = luxon.Duration.fromObject(time_diff).toFormat('MM-dd hh:mm:ss').split(" ")
      let date = time_left[0].split('-')
      let m = 'Month', d = 'Day'
      
      if (parseInt(date[0]) > 1) m += 's'
      if (parseInt(date[1]) > 1) d += 's'
      if (parseInt(date[0]) <= 0) { m=""; date[0]="" }
      if (parseInt(date[1]) <= 0) { d=""; date[1]="" }

      // Format time display for both desktop and mobile
      let timeDisplay = `${date[0]} <span style="font-size: 14px; font-weight: 400; color: var(--gray);">${m}</span> ${date[1]} <span style="font-size: 14px; font-weight: 400; color: var(--gray);">${d}</span> ${time_left[1]}`
      $('.countdown-time').html(timeDisplay)

      // Update epoch and slot counters
      if (t <= 0) {
        fetch('/latestState')
        .then(res=>res.json().then((data) => {
          c_epoch = data.currentEpoch
          c_slot = data.currentSlot
          t = 12
        }))
        t = 60 // prevent sending too many requests
      }

      let epoch_left = timeToEpoch({{ .Countdown.Timestamp }}) - c_epoch
      let slots_left = timeToSlot({{ .Countdown.Timestamp }}) - c_slot
      epoch_left = epoch_left < 0 ? 0 : epoch_left
      slots_left = slots_left < 0 ? 0 : slots_left

      $('.countdown-epoch').html(epoch_left)
      $('.countdown-slot').html(slots_left)
      
      t = t - 1
    }

    $(document).ready(() => {
      updateCountdown()
      requestAnimationFrame(() => {
        setInterval(() => {
          if (document.hasFocus()) {
            updateCountdown()
          }
        }, 1000)
      })
    })
  </script>
  {{ end }}
{{ end }}
