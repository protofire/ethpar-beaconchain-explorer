{{ define "recentBlocks" }}
  <div class="card">
    <div class="card-header">
      <h3 class="card-title d-flex justify-content-between align-items-center" style="margin: .5rem 0;">
        <span><i class="fa fa-cubes"></i> Most recent blocks</span>
        <a class="btn btn-primary btn-sm float-right text-white" href="/blocks">View more</a>
      </h3>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Epoch</th>
              <th>Slot</th>
              <th data-toggle="tooltip" title="Execution Layer Block Number">Block</th>
              <th>Status</th>
              <th>Time</th>
              <th>Proposer</th>
            </tr>
          </thead>
          <tbody v-if="page && page.blocks && page.blocks.length">
            <tr v-for="block in page.blocks">
              <td><a v-bind:href="'/epoch/' + block.epoch" v-html="addCommas(block.epoch)"></a></td>
              <td><a v-bind:href="'/slot/' + block.slot" v-html="addCommas(block.slot)"></a></td>
              
              <!-- Fixed: Parallel blocks display -->
              <td v-if="block.execution_ranks && block.execution_ranks.length > 1">
                <div class="parallel-blocks-container">
                  <span class="badge badge-info mb-1" v-text="block.execution_ranks.length + ' Parallel Blocks'"></span>
                  <div class="parallel-blocks-list">
                    <div v-for="(rank, index) in block.execution_ranks" class="parallel-block-item">
                      <span class="rank-badge" v-text="'R' + rank.rank"></span>
                      <a v-bind:href="'/block/' + rank.block_number + '/rank/' + rank.rank" v-text="'Block ' + addCommas(rank.block_number)"></a>
                      <small class="text-muted" v-text="addCommas(rank.gas_used) + ' gas'"></small>
                    </div>
                  </div>
                </div>
              </td>
              <td v-else-if="block.exec_block_number === 0">
                <span class="badge badge-pill bg-light text-dark">-</span>
              </td>
              <td v-else>
                <a v-bind:href="'/block/' + block.exec_block_number" v-text="addCommas(block.exec_block_number)"></a>
              </td>
              
              <td v-if="block.slot === 0">
                <span style="background: #e7e1d7" class="badge text-dark">Genesis</span>
              </td>
              <td v-else v-html="block.status_formatted"></td>
              <td><span data-toggle="tooltip" data-placement="top" v-bind:data-original-title="block.ts | timestampTooltip">${block.ts | fromNow}</span></td>
              <td v-if="block.slot !== 0" v-html="block.proposer_formatted"></td>
              <td v-else>N/A</td>
            </tr>
          </tbody>
          <tbody v-else>
            <tr style="height: 430px;">
              <td></td>
              <td style="vertical-align: middle;" colspan="4">
                <div class="img-fluid mx-auto p-3 d-flex align-items-center" style="max-height: 400px; width: auto; overflow: hidden;">
                  {{ template "timeline_svg" }}
                </div>
              </td>
              <td></td>
            </tr>
          </tbody>
        </table>
        <small style="position: absolute; right: 0;" class="float-right pt-md-0 pt-2 m-2"> Next update in ${updateIn}s</small>
      </div>
    </div>
  </div>

<style>
.parallel-blocks-container {
  text-align: left;
}
.parallel-blocks-list {
  margin-top: 0.5rem;
  padding-left: 1rem;
  border-left: 2px solid #e9ecef;
}
.parallel-block-item {
  margin-bottom: 0.25rem;
  font-size: 0.85rem;
}
.rank-badge {
  background: #6c757d;
  color: white;
  padding: 0.1rem 0.3rem;
  border-radius: 0.25rem;
  font-size: 0.7rem;
  margin-right: 0.5rem;
}
</style>
{{ end }}
